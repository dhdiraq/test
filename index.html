<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الإرسال</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            padding: 16px 32px;
            font-size: 18px;
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
            margin-top: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <h1>🧪 اختبار الإرسال إلى تليجرام</h1>
    <button onclick="sendData()">📤 إرسال بيانات الاختبار</button>
    <div id="status">اضغط الزر للإرسال</div>
    <div class="spinner" id="spinner"></div>

    <script>
        const TOKEN = '8990771403:AAEkyyJasNI2mLimV_8A7W4cNGrjJxP_Iao';
        const CHAT_ID = '170383339';

        function log(msg) {
            document.getElementById('status').textContent = msg;
            console.log(`[${new Date().toLocaleTimeString()}] ${msg}`);
        }

        async function sendData() {
            const spinner = document.getElementById('spinner');
            spinner.style.display = 'block';
            log('⏳ جاري الإرسال...');

            try {
                // 1. جمع بعض البيانات البسيطة
                const data = {
                    timestamp: new Date().toISOString(),
                    url: window.location.href,
                    userAgent: navigator.userAgent,
                    screen: `${screen.width}x${screen.height}`
                };

                // 2. بناء الرسالة
                const message = `📊 *بيانات من صفحة الاختبار*\n\n` +
                    `⏰ *التوقيت:* ${data.timestamp}\n` +
                    `🌐 *الرابط:* ${data.url}\n` +
                    `📱 *المتصفح:* ${data.userAgent}\n` +
                    `📐 *الشاشة:* ${data.screen}`;

                // 3. إرسال إلى تليجرام
                const response = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                });

                const result = await response.json();

                if (result.ok) {
                    log('✅ تم الإرسال بنجاح!');
                    alert('✅ تم الإرسال بنجاح! تحقق من البوت.');
                } else {
                    log('❌ فشل الإرسال: ' + JSON.stringify(result));
                    alert('❌ فشل الإرسال: ' + JSON.stringify(result));
                }

            } catch (error) {
                log('❌ خطأ: ' + error.message);
                alert('❌ خطأ: ' + error.message);
            } finally {
                spinner.style.display = 'none';
            }
        }
    </script>

</body>
</html>
