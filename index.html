<!DOCTYPE html>
<html>
<body>
    <h1>اختبار إرسال إلى تليجرام</h1>
    <button onclick="sendTest()">إرسال اختبار</button>
    <div id="log"></div>
    <script>
        function sendTest() {
            const token = '8990771403:AAEkyyJasNI2mLimV_8A7W4cNGrjJxP_Iao';
            const chatId = '170383339';
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            const data = {
                chat_id: chatId,
                text: '✅ تم الإرسال من الكود المختصر'
            };

            document.getElementById('log').innerHTML = '⏳ جاري الإرسال...';

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(json => {
                document.getElementById('log').innerHTML = json.ok ? 
                    '✅ تم الإرسال بنجاح!' : 
                    '❌ فشل: ' + JSON.stringify(json);
            })
            .catch(err => {
                document.getElementById('log').innerHTML = '❌ خطأ: ' + err.message;
            });
        }
    </script>
</body>
</html>
